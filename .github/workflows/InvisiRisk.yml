name: SNYK x InvisiRisk 

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    name: Sync fork and Run build

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
      # ============= InvisiRisk Setup End =============

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        
      - name: Export Dependency Tree to JSON
        run: npm list --all --json > dependencies.json

      - name: Convert JSON to CSV
        run: |
          node .github/scripts/deps-to-csv.js

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependencies-csv
          path: dependencies.csv