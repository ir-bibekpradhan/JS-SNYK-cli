name: InvisiRisk List Policy Runtime Matrix

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which list-policy runtime scenario should run?
        required: true
        default: all
        type: choice
        options:
          - all
          - network
          - package
          - repo
          - mixed-all

permissions:
  actions: read
  checks: write
  contents: read

env:
  IR_STAGE_URL: https://app.stage.invisirisk.com

jobs:
  unlisted-control:
    name: "CONTROL - unlisted URL, host, and MIME (expect default Allow)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'network' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request an unlisted value
        shell: bash
        run: |
          set -euo pipefail
          url='https://httpbin.org/response-headers?Content-Type=application%2Fx-invisirisk-qa-unlisted'
          echo "Scenario: no configured list should match"
          echo "URL: ${url}"
          curl --fail-with-body --silent --show-error \
            --dump-header control-headers.txt \
            --output control-body.txt \
            "${url}"
          sed -n '1,20p' control-headers.txt

  listed-url:
    name: "MATCH - URL https://example.com (expect Warn)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'network' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request the URL stored in valid_url
        shell: bash
        run: |
          set -euo pipefail
          url='https://example.com'
          echo "Scenario: URL is present in list valid_url"
          echo "URL: ${url}"
          curl --fail-with-body --silent --show-error \
            --dump-header listed-url-headers.txt \
            --output listed-url-body.txt \
            "${url}"
          sed -n '1,20p' listed-url-headers.txt

  listed-host:
    name: "MATCH - host github.com (expect Warn)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'network' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request a path on the host stored in valid_hosts
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/robots.txt'
          echo "Scenario: Host github.com is present in list valid_hosts"
          echo "URL: ${url}"
          curl --fail-with-body --silent --show-error \
            --dump-header listed-host-headers.txt \
            --output listed-host-body.txt \
            "${url}"
          sed -n '1,20p' listed-host-headers.txt

  listed-mime-type:
    name: "MATCH - MIME application/json (expect Warn)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'network' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request content with a MIME type stored in valid_mime_type
        shell: bash
        run: |
          set -euo pipefail
          url='https://httpbin.org/json'
          echo "Scenario: response MIME application/json is present in list valid_mime_type"
          echo "URL: ${url}"
          curl --fail-with-body --silent --show-error \
            --dump-header listed-mime-headers.txt \
            --output listed-mime-body.txt \
            "${url}"
          sed -n '1,20p' listed-mime-headers.txt

  listed-package-version:
    name: "MATCH - npm / express / 4.18.2 / download (expect Warn)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'package' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the QA fixture
        uses: actions/checkout@v4

      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the package version stored in valid_version
        shell: bash
        run: |
          set -euo pipefail
          echo "Scenario: package version 4.18.2 is present in list valid_version"
          echo "Package Name: express (valid_package_name)"
          echo "Package Registry: npm (validpackage_registry)"
          echo "Expected runtime Action: download (valid_actions)"
          npm install --prefix qa-policy-fixtures --ignore-scripts

  listed-repo:
    name: "MATCH - repo ir-bibekpradhan/JS-SNYK-cli (expect Deny)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'repo' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request the repository stored in qa_runtime_repo
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ir-bibekpradhan/JS-SNYK-cli'
          echo "Scenario: Repo ir-bibekpradhan/JS-SNYK-cli is present in qa_runtime_repo"
          echo "URL: ${url}"
          curl --fail-with-body --silent --show-error \
            --dump-header listed-repo-headers.txt \
            --output listed-repo-body.txt \
            "${url}"
          sed -n '1,20p' listed-repo-headers.txt

  mixed-all:
    name: "MATCH ALL - listed URL plus HTTP 404 (expect Warn)"
    if: ${{ inputs.scenario == 'all' || inputs.scenario == 'mixed-all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up InvisiRisk protection
        uses: invisirisk/pse-action@latest
        with:
          api_url: ${{ env.IR_STAGE_URL }}
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Request a listed URL that returns 404
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/example/project'
          echo "Scenario: URL is in valid_url AND response status must be 404"
          echo "URL: ${url}"
          status=$(curl --silent --show-error \
            --dump-header mixed-all-headers.txt \
            --output mixed-all-body.txt \
            --write-out '%{http_code}' \
            "${url}")
          sed -n '1,20p' mixed-all-headers.txt
          echo "Observed HTTP status: ${status}"
          test "${status}" = '404'
