name: SNYK xasd InvisiRisk

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    name: Sync fork and Run build

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@develop
        with:
          api_url: "https://app.stage.invisirisk.com"
      # ============= InvisiRisk Setup End =============

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .

      - name: Extract archive from Docker image
        run: |
          container_id=$(docker create my-app:latest)
          docker cp "$container_id:/app/archive.zip" ./archive.zip
          docker rm "$container_id"
          ls -lh archive.zip

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: archive.zip
          if-no-files-found: error
