name: SNYK x InvisiRisk (Uncached)

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    name: Sync fork and Run build

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          
      # 2️⃣ Setup PSE (InvisiRisk)
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          mode: "docker-intercept"

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4️⃣ Enable Corepack (Yarn)
      - name: Enable Corepack
        run: corepack enable

      # 5️⃣ Fresh install (no cache)
      - name: Install dependencies (fresh)
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          yarn install --no-cache

      # 6️⃣ Optional: show installed packages
      - name: List installed packages
        run: yarn list --depth=0

      # 7️⃣ Cleanup PSE
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"

  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: sync-and-build
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
          debug: "true"
