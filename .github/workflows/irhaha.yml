name: SNYK Fresh Install

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Fresh Install (No Cache)

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Enable Corepack (Yarn)
      - name: Enable Corepack (Yarn)
        run: corepack enable

      # 4️⃣ Fresh Install (no cache)
      - name: Install dependencies (uncached)
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          yarn install --no-cache

      # 5️⃣ Verify installed packages
      - name: List installed packages
        run: yarn list --depth=0

      # 6️⃣ Optional: Run build / tests
      - name: Run build
        run: yarn build
